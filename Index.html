<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile Card</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: aquamarine;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        .card-container {
            background-color: white;
            width: 350px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .img {
            background-image: url('queen-ant.jpg');
            background-size: cover;
            background-position: center;
            width: 100%;
            height: 200px;
            border-radius: 10px;
        }

        .icon img {
            width: 120px;
            height: 120px;
            border: 6px solid rgb(211, 203, 203);
            border-radius: 50%;
            margin-top: -60px;
            background-color: white;
        }

        h2 {
            margin: 10px 0 5px;
            color: #333;
        }

        h4 {
            margin: 0;
            color: rgb(248, 120, 120);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .stat {
            text-align: center;
        }

        .num {
            color: blue;
            font-weight: bold;
            font-size: 18px;
        }

        .label {
            color: #555;
            font-size: 14px;
        }

        .card-container button {
            background-color: yellow;
            border-color: yellow;
            width: 200px;
            border-radius: 100px;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div class="card-container">
        <div class="img"></div>
        <div class="icon">
            <img src="cartoon-icon-20.jpg" alt="Icon" />
        </div>
        <h2>Syed Aariz Hussain</h2>
        <h4>Ant collector</h4>

        <!-- Followers & Following -->
        <div class="stats">
            <div class="stat">
                <div class="num">12</div>
                <div class="label">Followers</div>
            </div>
            <div class="stat">
                <div class="num">1000</div>
                <div class="label">Following</div>
            </div>
        </div>
        <button>Follow</button>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Aut molestiae animi pariatur ea libero, autem aperiam. Similique amet mollitia repudiandae, optio corrupti omnis reiciendis itaque doloribus, voluptate modi nisi sunt.</p>
    </div>
</body>

</html>
